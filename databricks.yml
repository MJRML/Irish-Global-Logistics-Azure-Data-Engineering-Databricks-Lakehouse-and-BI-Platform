# This is a Declarative Automation Bundle definition for global_logistics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: global_logistics
  uuid: c9306ec7-6ad8-42b0-9bc1-1b9746582336

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Unity Catalog catalog for deployment
    default: logistics_dev
  job_schedule_pause_status:
    description: Controls whether the orchestration job schedule is paused
    default: PAUSED

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405614598924088.8.azuredatabricks.net
    variables:
      catalog: logistics_dev
      job_schedule_pause_status: PAUSED
  prod:
    mode: production
    workspace:
      host: https://adb-7405614598924088.8.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/mjryan947@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mjryan947@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: logistics_prod
      job_schedule_pause_status: UNPAUSED
    
